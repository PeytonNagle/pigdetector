<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PigDetector</title>
  <meta name="description" content="PigDetector watches your fridge door and temperature.">
  <style>
    :root { --bg: #fdf4f7; --card: #fff; --ink: #2a1a22; --muted: #7a5c69; --accent: #c8336e; --line: #ecd5df; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1a1116; --card: #24171e; --ink: #f6e9ef; --muted: #b897a6; --accent: #ff6fa3; --line: #3a2730; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 720px; margin: 0 auto; padding: 24px 16px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    h1 { margin: 0; font-size: 28px; }
    h2 { margin: 0 0 8px; font-size: 18px; }
    button, input { font: inherit; }
    button { padding: 8px 16px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
    input { padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); min-width: 0; }
    form { display: flex; flex-wrap: wrap; gap: 8px; margin: 24px 0 8px; }
    form input { flex: 1 1 160px; }
    .muted { color: var(--muted); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-top: 12px; }
    dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 0; }
    dt { color: var(--muted); }
    dd { margin: 0; overflow-wrap: anywhere; }
    .chart { margin: 12px 0 0; }
    .chart svg { display: block; width: 100%; height: 160px; background: var(--bg); border-radius: 8px; }
    .chart .series { fill: none; stroke: var(--accent); stroke-width: 2; vector-effect: non-scaling-stroke; }
    .chart .limit { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 6 4; vector-effect: non-scaling-stroke; }
    .chart figcaption { font-size: 14px; margin-top: 4px; }
    [hidden] { display: none !important; }
  </style>
  <script src="js/app.js" type="module"></script>
</head>
<body>
  <main>
    <header>
      <h1>🐷 PigDetector</h1>
      <button id="login" type="button" hidden>Log in</button>
      <button id="logout" type="button" hidden>Log out</button>
    </header>
    <p id="status" class="muted" role="status"></p>
    <section id="dashboard" hidden>
      <form id="register">
        <input id="deviceId" placeholder="Device ID (pd-xxxxxxxx)" required aria-label="Device ID">
        <input id="name" placeholder="Name (optional)" maxlength="40" aria-label="Name">
        <button type="submit">Register node</button>
      </form>
      <p id="registerStatus" class="muted" role="status"></p>
      <div id="nodes"></div>
    </section>
  </main>
</body>
</html>
