name: cloud

on:
  push:
    branches: [main]
    paths: ["cloud/**", "fixtures/schemas/**", ".github/workflows/cloud.yml"]
  workflow_dispatch:

permissions:
  id-token: write # lets the job request a GitHub OIDC token for AWS
  contents: read

# One deploy at a time; a newer merge waits for the running one.
concurrency:
  group: pd-stack
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # SAM builds in source (samconfig.toml), where it prunes dev dependencies, so esbuild must be global.
      - run: npm install -g esbuild@0.28.2

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - run: sam build
      - run: sam deploy

      # invoke exits 0 even when the function throws, so check FunctionError ("None" when it ran cleanly).
      - name: Smoke test pd-api
        run: |
          err=$(aws lambda invoke --function-name pd-api --query FunctionError --output text out.json)
          cat out.json
          test "$err" = "None"
