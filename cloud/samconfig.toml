# Shared by local `sam deploy` and CI so both deploy the same way.
version = 0.1

[default.global.parameters]
stack_name = "pd-stack"
region = "us-west-1"

[default.deploy.parameters]
resolve_s3 = true
capabilities = "CAPABILITY_IAM CAPABILITY_NAMED_IAM"
confirm_changeset = false
fail_on_empty_changeset = false

[default.build.parameters]
# Build in place so esbuild can bundle ../../../../fixtures/schemas, which sits outside CodeUri.
# This prunes devDependencies, so esbuild is a regular dependency of pd_api.
build_in_source = true
