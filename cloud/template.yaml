AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: PigDetector stack (pd-stack). Deployed by .github/workflows/cloud.yml on merges to main.

Parameters:
  SiteUrl:
    Type: String
    Default: https://main.dc3k8sg5zaosx.amplifyapp.com
    Description: Amplify site, used for login and logout redirects
  LocalUrl:
    Type: String
    Default: http://localhost:5500
    Description: Local dev server for web/

Resources:
  # ---------- DynamoDB (C3) ----------
  # Provisioned capacity totals 9 read / 14 write units, inside the free tier's 25 / 25.

  NodesTable:
    Type: AWS::DynamoDB::Table
    # Keep data if the stack is deleted or this resource gets replaced.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: pd_nodes
      # Retain guards the table; PITR guards the rows (ownership can't be rebuilt). Costs ~$0 at this size.
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      BillingMode: PROVISIONED
      AttributeDefinitions:
        - { AttributeName: deviceId, AttributeType: S }
        - { AttributeName: ownerSub, AttributeType: S }
      KeySchema:
        - { AttributeName: deviceId, KeyType: HASH }
      ProvisionedThroughput: { ReadCapacityUnits: 1, WriteCapacityUnits: 1 }
      GlobalSecondaryIndexes:
        # Lists a user's nodes without scanning the table.
        - IndexName: byOwner
          KeySchema:
            - { AttributeName: ownerSub, KeyType: HASH }
          Projection: { ProjectionType: ALL }
          ProvisionedThroughput: { ReadCapacityUnits: 1, WriteCapacityUnits: 1 }

  LatestTable:
    Type: AWS::DynamoDB::Table
    # Keep data if the stack is deleted or this resource gets replaced.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: pd_latest
      BillingMode: PROVISIONED
      AttributeDefinitions:
        - { AttributeName: deviceId, AttributeType: S }
      KeySchema:
        - { AttributeName: deviceId, KeyType: HASH }
      ProvisionedThroughput: { ReadCapacityUnits: 2, WriteCapacityUnits: 2 }

  HistoryTable:
    Type: AWS::DynamoDB::Table
    # Keep data if the stack is deleted or this resource gets replaced.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: pd_history
      BillingMode: PROVISIONED
      AttributeDefinitions:
        - { AttributeName: deviceId, AttributeType: S }
        - { AttributeName: ts, AttributeType: N }
      KeySchema:
        - { AttributeName: deviceId, KeyType: HASH }
        - { AttributeName: ts, KeyType: RANGE }
      # 10 write units absorb the recovered-readings upload after an outage.
      ProvisionedThroughput: { ReadCapacityUnits: 5, WriteCapacityUnits: 10 }

  # ---------- API Lambda (C4) ----------

  # API Gateway checks the Cognito token, so the Lambda only sees signed-in callers.
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience: [!Ref UserPoolClient]
      # API Gateway answers preflight itself, without the authorizer.
      CorsConfiguration:
        AllowOrigins: [!Ref SiteUrl, !Ref LocalUrl]
        AllowHeaders: [authorization, content-type]
        AllowMethods: [GET, POST]
        MaxAge: 600

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: pd-api
      Description: PigDetector API
      CodeUri: lambda/pd_api
      Handler: index.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 10
      LoggingConfig:
        LogGroup: !Ref ApiFunctionLogs
      Events:
        ListNodes:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: GET, Path: /nodes }
        RegisterNode:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: POST, Path: /nodes }
        NodeHistory:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: GET, Path: /nodes/{deviceId}/history }
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !Sub ${NodesTable.Arn}/index/byOwner
            - Effect: Allow
              Action: [dynamodb:PutItem, dynamodb:GetItem]
              Resource: !GetAtt NodesTable.Arn
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !GetAtt HistoryTable.Arn
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt LatestTable.Arn
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        Platform: node
        Target: node22
        OutExtension: [.js=.mjs]
        # Prefer ESM builds: the SDK's CommonJS builds call require(), which an ESM bundle can't do.
        MainFields: module,main
        EntryPoints: [index.mjs]
        Minify: false

  ApiFunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/pd-api
      RetentionInDays: 14

  # The Lambda logs invalid_node when a node's latest state breaks the API contract.
  # A term pattern, since text-format Lambda logs prefix each JSON line with time, request ID and level.
  ApiInvalidNodeMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ApiFunctionLogs
      FilterPattern: '"invalid_node"'
      MetricTransformations:
        - { MetricNamespace: PigDetector, MetricName: ApiInvalidNodes, MetricValue: "1", DefaultValue: 0 }

  ApiInvalidNodeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: pd-api-invalid-nodes
      AlarmDescription: A node's latest state breaks the API contract, so GET /nodes left it out or POST /nodes refused it. See /aws/lambda/pd-api.
      Namespace: PigDetector
      MetricName: ApiInvalidNodes
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  # ---------- Cognito (C5) ----------

  UserPool:
    Type: AWS::Cognito::UserPool
    # Keep data if the stack is deleted or this resource gets replaced.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: pd-users
      UserPoolTier: ESSENTIALS
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Schema:
        - { Name: email, AttributeDataType: String, Required: true, Mutable: true }
      AccountRecoverySetting:
        RecoveryMechanisms:
          - { Name: verified_email, Priority: 1 }

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: pd-web
      UserPoolId: !Ref UserPool
      # Public browser client: no secret, code grant with PKCE.
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs:
        - !Sub ${SiteUrl}/
        - !Sub ${LocalUrl}/
        - !Sub ${SiteUrl}/callback.html
        - !Sub ${LocalUrl}/callback.html
      LogoutURLs:
        - !Sub ${SiteUrl}/index.html
        - !Sub ${LocalUrl}/index.html
      ExplicitAuthFlows: [ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Sub pigdetector-${AWS::AccountId}
      ManagedLoginVersion: 2

  # Managed login v2 shows a broken page for any client without a branding style.
  LoginBranding:
    Type: AWS::Cognito::ManagedLoginBranding
    DependsOn: UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      ClientId: !Ref UserPoolClient
      UseCognitoProvidedValues: true

  # ---------- IoT Core (C2) ----------
  # Certificates are made by hand and attached to these (private keys never go in a template).

  GatewayThing:
    Type: AWS::IoT::Thing
    Properties:
      ThingName: pd-gw-01
      AttributePayload:
        Attributes: { nodePrefix: pd- }

  # Test gateways may only publish for test IDs (pd-0000xxxx), so they can't overwrite a real node's data.
  FakeGatewayThing:
    Type: AWS::IoT::Thing
    Properties:
      ThingName: pd-fake-gw
      AttributePayload:
        Attributes: { nodePrefix: pd-0000 }

  GatewayPolicy:
    Type: AWS::IoT::Policy
    Properties:
      PolicyName: pd-gateway
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # A certificate can only connect using the name of the thing it's attached to.
          - Effect: Allow
            Action: iot:Connect
            Resource: !Sub arn:aws:iot:${AWS::Region}:${AWS::AccountId}:client/${!iot:Connection.Thing.ThingName}
          - Effect: Allow
            Action: iot:Publish
            Resource:
              - !Sub arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/pigdetector/${!iot:Connection.Thing.Attributes[nodePrefix]}*/state
              - !Sub arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/pigdetector/${!iot:Connection.Thing.Attributes[nodePrefix]}*/recovered
          - Effect: Allow
            Action: iot:Subscribe
            # Policies treat + literally: allow one pigdetector/+/cmd subscription or one per node.
            Resource:
              - !Sub arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topicfilter/pigdetector/+/cmd
              - !Sub arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topicfilter/pigdetector/${!iot:Connection.Thing.Attributes[nodePrefix]}*/cmd
          # Scoped like Publish, so a test gateway subscribed to + never receives a real node's commands.
          - Effect: Allow
            Action: iot:Receive
            Resource: !Sub arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/pigdetector/${!iot:Connection.Thing.Attributes[nodePrefix]}*/cmd

  # Drops payloads whose deviceId disagrees with the topic, ts in seconds or missing (contract: ms since 2020),
  # and a missing or unknown type or one mixing door and temp fields, which the API could never show.
  LiveRule:
    Type: AWS::IoT::TopicRule
    Properties:
      RuleName: pd_live
      TopicRulePayload:
        AwsIotSqlVersion: "2016-03-23"
        Sql: >-
          SELECT *, 'live' AS source, 1 AS v FROM 'pigdetector/+/state'
          WHERE deviceId = topic(2) AND ts >= 1577836800000
          AND ((type = 'door' AND NOT isUndefined(door) AND isUndefined(tempC))
          OR (type = 'temp' AND NOT isUndefined(tempC) AND isUndefined(door)))
        RuleDisabled: false
        Actions:
          - DynamoDBv2:
              PutItem: { TableName: !Ref LatestTable }
              RoleArn: !GetAtt RulesRole.Arn
          - DynamoDBv2:
              PutItem: { TableName: !Ref HistoryTable }
              RoleArn: !GetAtt RulesRole.Arn
        ErrorAction:
          CloudwatchLogs:
            LogGroupName: !Ref RulesErrorLogs
            RoleArn: !GetAtt RulesRole.Arn

  # Recovered readings are old, so they skip pd_latest and never replace the current state.
  RecoveredRule:
    Type: AWS::IoT::TopicRule
    Properties:
      RuleName: pd_recovered
      TopicRulePayload:
        AwsIotSqlVersion: "2016-03-23"
        Sql: >-
          SELECT *, 'recovered' AS source, 1 AS v FROM 'pigdetector/+/recovered'
          WHERE deviceId = topic(2) AND ts >= 1577836800000
        RuleDisabled: false
        Actions:
          - DynamoDBv2:
              PutItem: { TableName: !Ref HistoryTable }
              RoleArn: !GetAtt RulesRole.Arn
        ErrorAction:
          CloudwatchLogs:
            LogGroupName: !Ref RulesErrorLogs
            RoleArn: !GetAtt RulesRole.Arn

  RulesErrorLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/iot/pd-rules-errors
      RetentionInDays: 14

  # Every line in the error log is a reading that didn't reach DynamoDB (throttled, bad key, denied).
  RulesErrorMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref RulesErrorLogs
      FilterPattern: ""
      MetricTransformations:
        - { MetricNamespace: PigDetector, MetricName: RuleWriteErrors, MetricValue: "1", DefaultValue: 0 }

  RulesErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: pd-rules-write-errors
      AlarmDescription: An IoT rule failed to write a gateway message to DynamoDB. See /aws/iot/pd-rules-errors.
      Namespace: PigDetector
      MetricName: RuleWriteErrors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  # Subscribe by hand so no email address lands in this public repo.
  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: pd-alerts

  RulesRole:
    Type: AWS::IAM::Role
    Properties:
      # The CI deploy role may only create roles named pd-*.
      RoleName: pd-iot-rules
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: iot.amazonaws.com }
            Action: sts:AssumeRole
            # Only this account's pd_ rules, so another account's rule can't borrow the role.
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub arn:aws:iot:${AWS::Region}:${AWS::AccountId}:rule/pd_*
      Policies:
        - PolicyName: pd-iot-rules
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: dynamodb:PutItem
                Resource:
                  - !GetAtt LatestTable.Arn
                  - !GetAtt HistoryTable.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:DescribeLogStreams
                  - logs:PutLogEvents
                Resource: !GetAtt RulesErrorLogs.Arn

  # Device errors (denied connects, subscribes, publishes) with client ID and topic; IoT writes to AWSIotLogsV2.
  IotLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: AWSIotLogsV2
      RetentionInDays: 14

  IotLogging:
    Type: AWS::IoT::Logging
    Properties:
      AccountId: !Ref AWS::AccountId
      DefaultLogLevel: ERROR
      RoleArn: !GetAtt IotLoggingRole.Arn

  IotLoggingRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: pd-iot-logging
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: iot.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: pd-iot-logging
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:PutMetricFilter
                  - logs:PutRetentionPolicy
                Resource: !GetAtt IotLogs.Arn

Outputs:
  ApiUrl:
    Description: Base URL for web/js/config.js
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  CognitoDomain:
    # Same literal as UserPoolDomain.Domain, so the URL doesn't depend on what Ref returns.
    Value: !Sub https://pigdetector-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com
