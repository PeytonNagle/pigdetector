AWSTemplateFormatVersion: "2010-09-09"
Description: >
  PigDetector bootstrap (stack pd-bootstrap). Deployed once by hand; lets GitHub
  Actions on main deploy pd-stack without stored AWS keys.

Parameters:
  # GitHub's immutable subject: owner@ownerId/repo@repoId. IDs can't be reused after a rename,
  # so a new repo with the old name can't match. Check: gh api repos/{owner}/{repo}/actions/oidc/customization/sub
  GitHubRepo:
    Type: String
    Default: PeytonNagle@124948563/pigdetector@1451805934

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: pd-github-deploy
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # Only workflows on main of this one repo; PRs and forks can't assume it.
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepo}:ref:refs/heads/main
      ManagedPolicyArns:
        # Everything except IAM; the IAM part is limited to pd-* roles below.
        - arn:aws:iam::aws:policy/PowerUserAccess
      Policies:
        - PolicyName: pd-manage-own-roles
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ManagePdRoles
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:UpdateRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:PutRolePolicy
                  - iam:GetRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:ListRolePolicies
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:ListAttachedRolePolicies
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/pd-*
              - Sid: PassPdRolesOnly
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/pd-*
              - Sid: NeverDeleteSelf
                Effect: Deny
                Action:
                  - iam:DeleteRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:PutRolePolicy
                  - iam:AttachRolePolicy
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/pd-github-deploy

Outputs:
  DeployRoleArn:
    Description: Put this in the repo's AWS_DEPLOY_ROLE_ARN Actions variable
    Value: !GetAtt DeployRole.Arn
